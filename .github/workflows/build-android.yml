name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa dipicu manual dari tab Actions

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"
  EXPORT_NAME: "KebunSawitSim"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # 2. Setup Java (dibutuhkan Android SDK)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Android SDK + NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & build tools
        run: |
          sdkmanager "ndk;23.2.8568313"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"

      # 4. Download Godot headless (Linux server export binary)
      - name: Download Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        run: |
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_FILE}.zip" -O godot.zip
          unzip -q godot.zip
          mv "${GODOT_FILE}" godot
          chmod +x godot
          sudo mv godot /usr/local/bin/godot

      # 5. Download export templates Android
      - name: Download Godot export templates
        run: |
          TEMPLATES_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TEMPLATES_FILE}" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      # 6. Buat debug keystore untuk signing
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android

      # 7. Update export_presets.cfg dengan path keystore
      - name: Configure keystore in export_presets
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|g" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|g" export_presets.cfg

      # 8. Buat folder output
      - name: Create build output folder
        run: mkdir -p build

      # 9. Export APK
      - name: Export Android APK
        run: |
          godot --headless --export-debug "Android" build/${{ env.EXPORT_NAME }}.apk
        continue-on-error: false

      # 10. Upload APK sebagai artifact (bisa didownload dari tab Actions)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-apk
          path: build/${{ env.EXPORT_NAME }}.apk
          retention-days: 30
