name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  EXPORT_NAME: "KebunSawitSim"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    # Dibutuhkan agar GITHUB_TOKEN boleh membuat Release (lihat step terakhir).
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java
        run: java -version

      - name: Install Android NDK & build-tools via pre-installed sdkmanager
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | ${SDKMANAGER} --sdk_root="${ANDROID_SDK_ROOT}" \
            "ndk;23.2.8568313" \
            "build-tools;34.0.0" \
            "platforms;android-34" 2>/dev/null || true
          echo "NDK path: ${ANDROID_SDK_ROOT}/ndk/23.2.8568313"
          ls "${ANDROID_SDK_ROOT}/ndk/" || echo "NDK not installed, trying alternative"

      - name: Download Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        run: |
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_FILENAME}.zip" \
            -O godot.zip
          unzip -q godot.zip
          mv "${GODOT_FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Godot export templates
        run: |
          TEMPLATES_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TEMPLATES_FILE}" \
            -O templates.tpz
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${TEMPLATE_DIR}"
          unzip -q templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "${TEMPLATE_DIR}/"
          echo "Templates:"
          ls "${TEMPLATE_DIR}/" | grep -i android

      # Setup release keystore dari GitHub Secrets.
      # Buat 4 secrets di Settings > Secrets > Actions:
      #   ANDROID_KEYSTORE_BASE64  — output dari: base64 -i release.keystore | pbcopy
      #   ANDROID_KEYSTORE_PASS    — storepass keystore
      #   ANDROID_KEY_ALIAS        — alias key ("upload")
      #   ANDROID_KEY_PASS         — keypass (sama dengan storepass)
      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p "${HOME}/.android"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${HOME}/.android/release.keystore"
            echo "RELEASE_KEYSTORE=${HOME}/.android/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASS=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "✅ Release keystore dari secrets"
          else
            keytool -genkey -v \
              -keystore "${HOME}/.android/release.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "RELEASE_KEYSTORE=${HOME}/.android/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=android" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASS=android" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret tidak diset — menggunakan debug keystore."
          fi

      - name: Configure Godot editor settings
        run: |
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "${RELEASE_KEYSTORE}"
          export/android/debug_keystore_user = "${RELEASE_KEYSTORE_USER}"
          export/android/debug_keystore_pass = "${RELEASE_KEYSTORE_PASS}"
          EOF

      - name: Inject release keystore into export_presets.cfg
        run: |
          sed -i "s|keystore/release=\"\"|keystore/release=\"${RELEASE_KEYSTORE}\"|" export_presets.cfg
          sed -i "s|keystore/release_user=\"\"|keystore/release_user=\"${RELEASE_KEYSTORE_USER}\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\"\"|keystore/release_password=\"${RELEASE_KEYSTORE_PASS}\"|" export_presets.cfg
          grep "keystore/release" export_presets.cfg | head -3

      - name: Import project resources
        run: |
          mkdir -p build
          timeout 60 godot --headless --import --path . 2>&1 || true
          echo "Import done"

      - name: Export Android APK (release)
        run: |
          godot --headless --export-release "Android" "build/${EXPORT_NAME}.apk" --path . 2>&1
          ls -lh build/ || echo "build/ kosong"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-release
          path: build/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      # Publikasikan APK sebagai GitHub Release.
      #
      # Kenapa perlu, padahal artifact di atas sudah ada:
      #   - Artifact WAJIB login GitHub -> tester tidak bisa mengunduh.
      #   - Artifact selalu dibungkus .zip -> tidak bisa tap-install dari HP,
      #     dan Chrome memblokirnya ("executable bersembunyi di dalam arsip").
      #   - Artifact kedaluwarsa 30 hari.
      # Release asset bersifat publik, berupa .apk langsung, dan permanen —
      # satu link bisa dibagikan ke 12 tester untuk closed testing nanti.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Pesan commit dilewatkan lewat env, BUKAN di-interpolasi langsung ke
          # dalam skrip. Pesan commit berisi backtick, kutip, dan baris baru —
          # interpolasi langsung akan merusak skrip, dan secara umum memasukkan
          # input yang bisa dikendalikan orang lain ke shell adalah pola injeksi.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          APK="build/${EXPORT_NAME}.apk"
          SIZE=$(du -h "${APK}" | cut -f1)
          # Nama file menyertakan nomor build supaya tester tahu versi mana yang
          # mereka pegang (semua build sebelumnya bernama sama persis -> bingung).
          RELEASE_APK="build/${EXPORT_NAME}-${TAG}.apk"
          cp "${APK}" "${RELEASE_APK}"

          # Catatan rilis ditulis ke file supaya aman terhadap karakter khusus.
          {
            echo "**Commit:** \`${COMMIT_SHA}\`"
            echo "**Ukuran APK:** ${SIZE}"
            echo
            echo "${COMMIT_MSG}"
            echo
            echo "---"
            echo "Unduh \`${EXPORT_NAME}-${TAG}.apk\` di bawah, lalu buka di HP."
            echo "Android akan meminta izin *Install unknown apps* — itu normal"
            echo "untuk aplikasi di luar Play Store."
          } > /tmp/release_notes.md

          gh release create "${TAG}" "${RELEASE_APK}" \
            --title "Build #${RUN_NUMBER}" \
            --notes-file /tmp/release_notes.md \
            --prerelease
          echo "✅ Release ${TAG} terbit"
          echo "   https://github.com/${REPO}/releases/tag/${TAG}"
