name: Build Android AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  EXPORT_NAME: "KebunSawitSim"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android AAB (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java
        run: java -version

      - name: Install Android NDK & build-tools via pre-installed sdkmanager
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | ${SDKMANAGER} --sdk_root="${ANDROID_SDK_ROOT}" \
            "ndk;23.2.8568313" \
            "build-tools;36.0.0" \
            "platforms;android-36" 2>/dev/null || true
          echo "NDK path: ${ANDROID_SDK_ROOT}/ndk/23.2.8568313"
          ls "${ANDROID_SDK_ROOT}/ndk/" || echo "NDK not installed, trying alternative"

      - name: Download Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        run: |
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_FILENAME}.zip" \
            -O godot.zip
          unzip -q godot.zip
          mv "${GODOT_FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Godot export templates
        run: |
          TEMPLATES_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TEMPLATES_FILE}" \
            -O templates.tpz
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${TEMPLATE_DIR}"
          unzip -q templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "${TEMPLATE_DIR}/"
          echo "Templates:"
          ls "${TEMPLATE_DIR}/" | grep -i android

      # Setup release keystore dari GitHub Secrets.
      # Buat 4 secrets di Settings > Secrets > Actions:
      #   ANDROID_KEYSTORE_BASE64  — output dari: base64 -w0 release.keystore
      #   ANDROID_KEYSTORE_PASS    — storepass keystore
      #   ANDROID_KEY_ALIAS        — alias key (mis. "upload")
      #   ANDROID_KEY_PASS         — keypass (biasanya sama dengan storepass)
      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p "${HOME}/.android"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${HOME}/.android/release.keystore"
            echo "RELEASE_KEYSTORE=${HOME}/.android/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASS=${KEY_PASS}" >> "$GITHUB_ENV"
          else
            keytool -genkey -v \
              -keystore "${HOME}/.android/release.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "RELEASE_KEYSTORE=${HOME}/.android/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=android" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASS=android" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret tidak diset — menggunakan debug keystore. AAB ini TIDAK valid untuk Play Store."
          fi

      - name: Configure Godot editor settings
        run: |
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "${RELEASE_KEYSTORE}"
          export/android/debug_keystore_user = "${RELEASE_KEYSTORE_USER}"
          export/android/debug_keystore_pass = "${RELEASE_KEYSTORE_PASS}"
          EOF
          cat "${HOME}/.config/godot/editor_settings-4.tres"

      - name: Inject release keystore into export_presets.cfg
        run: |
          sed -i "s|keystore/release=\"\"|keystore/release=\"${RELEASE_KEYSTORE}\"|" export_presets.cfg
          sed -i "s|keystore/release_user=\"\"|keystore/release_user=\"${RELEASE_KEYSTORE_USER}\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\"\"|keystore/release_password=\"${RELEASE_KEYSTORE_PASS}\"|" export_presets.cfg
          grep "keystore/release" export_presets.cfg | head -3

      # Install Android build template ke project (wajib saat use_gradle_build=true).
      # android_source.zip sudah ada di dalam templates.tpz yang didownload di atas —
      # tinggal diekstrak ke android/build/ supaya Godot bisa jalankan gradle export.
      - name: Install Android build template
        run: |
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          SRC="${TEMPLATE_DIR}/android_source.zip"
          if [ ! -f "${SRC}" ]; then
            echo "❌ android_source.zip tidak ada di ${TEMPLATE_DIR}"
            ls "${TEMPLATE_DIR}/" | head -20
            exit 1
          fi
          mkdir -p android/build
          unzip -q "${SRC}" -d android/build/
          # Buat .gdignore agar Godot tidak mencoba import file Java/Kotlin/Gradle
          touch android/build/.gdignore
          echo "✅ Android build template terpasang"
          ls android/build/ | head -10

      - name: Import project resources
        run: |
          mkdir -p build
          timeout 60 godot --headless --import --path . 2>&1 || true
          echo "Import done"

      - name: Export Android AAB (release)
        run: |
          godot --headless --export-release "Android" "build/${EXPORT_NAME}.aab" --path . 2>&1
          ls -lh build/ || echo "build/ kosong"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-aab
          path: build/${{ env.EXPORT_NAME }}.aab
          if-no-files-found: error
          retention-days: 30
